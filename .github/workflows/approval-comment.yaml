name: ApprovalComment
on:
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  approval-comment:
    if: startsWith(github.event.review.body, '/karpenter perf')
    runs-on: ubuntu-latest
    steps:
      - name: head-definition marker
        run: |
          echo "REVIEW_HEAD_DEF_MARKER"
          id
          echo "GHTLEN=${#GITHUB_TOKEN}"
          env | grep -E '^GITHUB_TOKEN=' | wc -l
